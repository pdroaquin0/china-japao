<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China + Japão · 28 ago — 14 set 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#F7F2E8; --paper2:#EFE7D5; --card:#FFFDF8;
  --ink:#232B33; --muted:#5C6670; --line:#DCD2BB;
  --china:#B23A2C; --china-dark:#7E281D; --china-soft:#F6E3DF;
  --japan:#2E4E78; --japan-dark:#1E3554; --japan-soft:#E3EAF4;
  --jade:#2E6B5C; --jade-dark:#1F4A40; --jade-soft:#E1EEE9;
  --gold:#B98F3E; --gold-soft:#F4EAD3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6;font-size:15px}
h1,h2,h3,h4,.serif{font-family:'Noto Serif JP',serif}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--jade-dark)}

/* ============ LAYOUT SHELL ============ */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

/* ---- sidebar ---- */
aside{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--ink);color:var(--paper);
  padding:34px 26px;display:flex;flex-direction:column;gap:0;
}
aside h1{font-size:21px;font-weight:900;margin:0 0 2px;letter-spacing:.01em}
aside .side-sub{font-size:11.5px;color:#9BA6AE;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
.countdown{
  margin:18px 0 24px;display:inline-flex;align-items:baseline;gap:7px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:8px 12px;font-family:'JetBrains Mono',monospace;
}
.countdown b{font-size:20px;color:var(--gold)}
.countdown span{font-size:11px;color:#9BA6AE}
aside nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
aside nav button{
  background:none;border:none;color:#B9C2C9;text-align:left;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
  padding:10px 12px;border-radius:8px;transition:.15s;display:flex;align-items:center;gap:10px;
}
aside nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
aside nav button.active{color:#fff;background:rgba(255,255,255,.12)}
aside nav button .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);width:16px}
.spine{margin-top:auto;padding-top:26px;border-top:1px solid rgba(255,255,255,.12)}
.spine .st{display:flex;gap:12px;align-items:flex-start;padding:5px 0;font-size:12px;color:#B9C2C9}
.spine .st i{
  width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:4px;
  border:2px solid var(--gold);background:transparent;font-style:normal;
}
.spine .st.cn i{border-color:#E08578}
.spine .st.jp i{border-color:#7FA3D4}
.spine .st b{color:#E9E4D8;font-weight:600}
.spine .st small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8890}
.side-foot{font-size:10.5px;color:#6E7880;margin-top:20px;line-height:1.5}

/* mobile header/nav override — precisa vir DEPOIS das regras base acima pra vencer no cascade */
@media(max-width:900px){
  aside{
    position:sticky;top:0;height:auto;overflow:visible;z-index:60;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    padding:10px 14px 0;gap:6px 10px;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  aside .spine, aside .side-foot, aside .side-sub{display:none}
  aside h1{font-size:16px;margin:0}
  .countdown{margin:0;padding:4px 10px;border-radius:7px}
  .countdown b{font-size:15px}
  .countdown span{font-size:9px}
  aside nav{
    display:flex;order:3;flex:1 0 100%;flex-direction:row;gap:4px;margin:2px -14px 0;
    padding:4px 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  aside nav::-webkit-scrollbar{display:none}
  aside nav button{flex:0 0 auto;padding:7px 13px;font-size:12.5px;white-space:nowrap}
  aside nav button .n{display:none}
}

/* ---- main ---- */
main{padding:44px clamp(20px,4vw,56px) 110px;max-width:1060px}
section{display:none}
section.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--china);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kicker::after{content:'';height:1px;width:44px;background:var(--china)}
section>h2{font-size:clamp(24px,3.4vw,34px);font-weight:900;margin:0 0 8px;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:14.5px;max-width:660px;margin:0 0 30px}

/* ---- cards & chips ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:15.5px;font-weight:700}
.card p{margin:0;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:9px}
.chip.ok{background:var(--jade-soft);color:var(--jade-dark)}
.chip.warn{background:var(--gold-soft);color:#7A5A1E}
.chip.cn{background:var(--china-soft);color:var(--china-dark)}
.chip.jp{background:var(--japan-soft);color:var(--japan-dark)}

/* ---- stats hero row ---- */
.stat-row{display:flex;flex-wrap:wrap;gap:28px;padding:22px 0 28px;border-bottom:1px solid var(--line);margin-bottom:30px}
.stat .num{font-family:'Noto Serif JP',serif;font-weight:900;font-size:27px;color:var(--jade-dark)}
.stat.hot .num{color:var(--china)}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

/* ---- chapter headers ---- */
.chapter{
  display:flex;align-items:baseline;gap:16px;margin:52px 0 6px;
  padding-bottom:10px;border-bottom:2px solid var(--line);
}
.chapter:first-of-type{margin-top:8px}
.chapter .glyph{font-family:'Noto Serif JP',serif;font-size:36px;font-weight:900;line-height:1;opacity:.22}
.chapter h3{margin:0;font-size:20px;font-weight:900}
.chapter .dates{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-left:auto}
.chapter.cn{border-color:var(--china)}.chapter.cn .glyph{color:var(--china)}
.chapter.jp{border-color:var(--japan)}.chapter.jp .glyph{color:var(--japan)}
.chapter-note{font-size:13px;color:var(--muted);margin:8px 0 22px;max-width:680px}

/* ---- day cards ---- */
.day{
  display:grid;grid-template-columns:72px 1fr;gap:20px;
  padding:24px 0;border-bottom:1px solid var(--line);
}
.day:last-child{border-bottom:none}
.dcol{text-align:right}
.ddate{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13.5px}
.dweek{font-size:11px;color:var(--muted)}
.dbody{position:relative;padding-left:22px;border-left:3px solid var(--line)}
.day.cn .dbody{border-color:var(--china)}
.day.jp .dbody{border-color:var(--japan)}
.day.tr .dbody{border-color:var(--gold)}
.dcity{font-weight:700;font-size:16px;font-family:'Noto Serif JP',serif;margin-bottom:5px}
.dprog{font-size:13.8px;color:var(--ink);margin-bottom:12px;line-height:1.65}
.dtip{
  font-family:'Noto Serif JP',serif;font-style:italic;font-size:13px;line-height:1.7;
  color:var(--jade-dark);background:#F1F6F3;border-left:2px solid var(--jade);
  padding:10px 15px;margin-bottom:12px;border-radius:0 8px 8px 0;
}
.dtip .ic{font-style:normal;color:var(--gold);margin-right:6px}
.dextra{
  font-size:12.5px;color:var(--muted);border:1px dashed var(--line);
  border-radius:8px;padding:10px 15px;line-height:1.65;margin-bottom:12px;
}
.dextra b{color:var(--ink)}
.dlinks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.blink{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--jade-dark);background:var(--jade-soft);border:1px solid #C8DFD6;
  padding:5px 12px;border-radius:20px;text-decoration:none;transition:.15s;
}
.blink:hover{background:#D3E8DF;border-color:var(--jade)}
.blink.done{background:var(--paper2);color:var(--muted);border-color:var(--line);text-decoration:line-through}
.dmaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.dmap{border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.dmap .ml{font-size:11px;font-weight:600;color:var(--muted);background:var(--paper2);padding:5px 11px}
.dmap iframe{width:100%;height:165px;border:0;display:block}
.stamp{
  display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:2px;
}
.stamp.ok{background:var(--jade-soft);color:var(--jade-dark)}
.stamp.new{background:var(--japan-soft);color:var(--japan-dark)}
.stamp.att{background:var(--china-soft);color:var(--china-dark)}

/* ---- hotels tab ---- */
.hotel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:24px 26px;margin-bottom:18px;
  display:grid;grid-template-columns:1fr auto;gap:8px 22px;
}
@media(max-width:700px){.hotel{grid-template-columns:1fr}}
.hotel .hcity{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.hotel h3{margin:0 0 4px;font-size:18px;font-weight:900}
.hotel .hwhy{font-size:13.5px;color:var(--ink);line-height:1.65;margin:8px 0 12px}
.hotel .hmeta{font-size:12px;color:var(--muted)}
.hotel .hprice{text-align:right}
@media(max-width:700px){.hotel .hprice{text-align:left}}
.hotel .hprice .v{font-family:'Noto Serif JP',serif;font-weight:900;font-size:22px;color:var(--jade-dark)}
.hotel .hprice .per{font-size:11px;color:var(--muted)}
.hotel .halt{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;grid-column:1/-1}
.hotel .halt b{color:var(--ink)}

/* ---- calendar ---- */
.cal-legend{display:flex;gap:16px;margin-bottom:22px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.cal-dot.cn{background:var(--china)}.cal-dot.jp{background:var(--japan)}.cal-dot.tr{background:var(--gold)}
.cal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.cal-wrap{grid-template-columns:1fr}}
.cal-month{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.cal-title{font-size:15px;margin:0 0 14px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{margin-bottom:6px}
.cal-wd{font-size:10px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600}
.cal-cell{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper2)}
.cal-cell.empty{background:transparent}
.cal-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.cal-city{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.1;margin-top:1px;padding:0 2px}
.cal-cell.act{cursor:pointer;transition:transform .12s;border:1.5px solid transparent}
.cal-cell.act:hover{transform:scale(1.07)}
.cal-cell.act.cn{background:var(--china-soft);border-color:var(--china)}
.cal-cell.act.cn .cal-num{color:var(--china-dark)}
.cal-cell.act.jp{background:var(--japan-soft);border-color:var(--japan)}
.cal-cell.act.jp .cal-num{color:var(--japan-dark)}
.cal-cell.act.tr{background:var(--gold-soft);border-color:var(--gold)}
.cal-cell.act.tr .cal-num{color:#7A5A1E}

/* ---- gantt ---- */
.gantt-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;overflow-x:auto}
.gantt-axis,.gantt-row{display:grid;gap:2px;min-width:880px}
.gantt-axis{margin-bottom:8px}
.gantt-dl{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:34px;display:flex;align-items:center;justify-content:center}
.gantt-row{align-items:center;padding:5px 0}
.gantt-lb{font-size:12px;font-weight:600;padding-right:10px}
.gantt-tk{display:grid;gap:2px;height:30px}
.gantt-bar{border-radius:5px;border:1.5px solid;font-size:10.5px;font-weight:600;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---- budget ---- */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.bar-lb{width:170px;font-size:12.5px;flex:0 0 auto}
.bar-tk{flex:1;height:9px;background:var(--paper2);border-radius:6px;overflow:hidden}
.bar-fl{height:100%;background:var(--jade)}
.bar-vl{width:92px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;flex:0 0 auto}
.total-banner{background:var(--ink);color:var(--paper);border-radius:12px;padding:24px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:22px}
.total-banner .tl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.65}
.total-banner .tv{font-family:'Noto Serif JP',serif;font-size:27px;font-weight:900}
.saving{background:var(--jade-soft);border:1px solid #C8DFD6;border-radius:10px;padding:13px 17px;font-size:13px;color:var(--jade-dark);margin-top:14px}

/* ---- checklist ---- */
.ck-cat{margin-bottom:26px}
.ck-cat h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--china);margin:0 0 10px}
.ck-item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.ck-item:last-child{border-bottom:none}
.ck-box{flex:0 0 auto;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:4px;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ck-item.done .ck-box{background:var(--jade);border-color:var(--jade)}
.ck-item.done .ck-box::after{content:'✓';color:#fff;font-size:11px}
.ck-item.done .ck-tx{text-decoration:line-through;color:var(--muted)}
.ck-when{font-size:11px;color:var(--china-dark);font-family:'JetBrains Mono',monospace;margin-left:auto;flex:0 0 auto;padding-left:10px}
.prog-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:26px;display:flex;align-items:center;gap:16px}
.prog-tk{flex:1;height:8px;background:var(--paper2);border-radius:6px;overflow:hidden}
.prog-fl{height:100%;background:var(--china);width:0%;transition:width .3s}
.prog-tx{font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap}

#routeMap{height:330px;border-radius:12px;border:1px solid var(--line);margin-bottom:26px}
::selection{background:#F0DAD5}
@media(max-width:640px){
  main{padding:24px 16px 90px}
  section>h2{font-size:23px}
  .lede{font-size:13.5px;margin-bottom:22px}
  .stat-row{gap:12px 24px;padding:14px 0 18px;margin-bottom:22px}
  .stat .num{font-size:20px}
  .stat .lbl{font-size:10px}
  /* dias: empilhar data acima do conteúdo */
  .day{grid-template-columns:1fr;gap:8px;padding:20px 0}
  .dcol{display:flex;gap:8px;align-items:baseline;text-align:left}
  .dbody{padding-left:15px}
  .dcity{font-size:15px}
  .dprog{font-size:13.3px}
  .dtip{font-size:12.5px;padding:9px 12px}
  .dextra{font-size:12px;padding:9px 12px}
  .dmap iframe{height:150px}
  /* capítulos: datas descem pra 2ª linha */
  .chapter{flex-wrap:wrap;gap:6px 12px;margin:40px 0 6px}
  .chapter .glyph{font-size:27px}
  .chapter h3{font-size:17px}
  .chapter .dates{margin-left:0;flex:1 0 100%;font-size:11px}
  /* orçamento: barras respiram */
  .bar-lb{width:112px;font-size:11px;line-height:1.35}
  .bar-vl{width:70px;font-size:11px}
  .total-banner{padding:18px 20px}
  .total-banner .tv{font-size:21px}
  .saving{font-size:12px}
  /* hotéis */
  .hotel{padding:18px 18px}
  .hotel h3{font-size:16px}
  .hotel .hwhy{font-size:13px}
  /* checklist */
  .ck-item{font-size:12.8px}
  .ck-when{font-size:10px;padding-left:8px}
  /* gantt: mantém scroll horizontal, rótulos menores */
  .gantt-lb{font-size:10.5px}
  #routeMap{height:250px}
}
@media print{aside{display:none}.shell{grid-template-columns:1fr}section{display:block !important}.dmaps,#routeMap{display:none}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div>
    <h1>China + Japão</h1>
    <div class="side-sub">28 AGO — 14 SET 2026 · 2 VIAJANTES</div>
  </div>
  <div class="countdown"><b id="cdNum">—</b><span id="cdLbl">dias para o embarque</span></div>
  <nav id="sideNav"></nav>
  <div class="spine" id="spine"></div>
  <div class="side-foot">Voos internacionais emitidos · seguro AIG/Visa ativo · salas VIP Visa & Bradesco</div>
</aside>

<main id="main"></main>
</div>

<script>
/* ================= DATA ================= */
const DEPART = new Date(2026,7,28);

const chapters = [
 {id:'pro', cls:'tr', glyph:'発', title:'Travessia', dates:'28–29 ago', note:'Duas noites em trânsito. A regra aqui é uma só: gastar o mínimo de energia. Sala VIP em Dubai (Visa/Bradesco), banho, comida de verdade e chegar em Pequim inteiro.'},
 {id:'bj', cls:'cn', glyph:'一', title:'Pequim — a China imperial', dates:'30 ago – 02 set', note:'Quatro dias na capital dos imperadores. O segredo de Pequim é o horário: os locais vivem a cidade entre 6h e 9h — tai chi no Templo do Céu, café da manhã de jianbing na rua. Quem chega às 10h vê só a fila.'},
 {id:'zjj', cls:'cn', glyph:'二', title:'Zhangjiajie — as montanhas de Avatar', dates:'02 – 06 set', note:'O coração natural da viagem, em território do povo Tujia — minoria étnica com culinária e música próprias. Base em Wulingyuan (entrada do parque), última noite na cidade aos pés da Tianmen. Timing a seu favor: as aulas chinesas recomeçam em 1º de setembro — vocês pegam o parque logo depois do êxodo das famílias, com filas visivelmente menores que em agosto.'},
 {id:'sz', cls:'cn', glyph:'三', title:'Shenzhen — a China do futuro', dates:'06 – 08 set', note:'De vila de pescadores a metrópole de 17 milhões em 40 anos. Dois dias: um para a cidade-laboratório (Huaqiangbei, Ping An), meio para respirar antes do Japão.'},
 {id:'tk', cls:'jp', glyph:'四', title:'Tóquio — do Edo ao neon', dates:'08 – 13 set', note:'Base no lado leste (Ueno/Asakusa): é o Tóquio antigo, mais barato, e — detalhe que quase ninguém percebe — a linha Asakusa tem trem direto para os DOIS aeroportos, Haneda na chegada e Narita na saída.'},
 {id:'epi', cls:'tr', glyph:'帰', title:'Retorno', dates:'13–14 set', note:'Bilhete único LATAM/Qatar já confirmado — conexão em Doha protegida. Última sala VIP e 14h35 até casa.'},
];

const roteiro = [
 {ch:'pro',d:'28/08',w:'sex',cls:'tr',city:'São Paulo → Dubai',stamp:'ok',
  prog:'Aeroporto às 18h. Voo EK262, 21:05, assentos 62K/62J confirmados.',
  tip:'Seguro AIG/Visa já ativo (US$175 mil médico, sem custo) — bilhete salvo no celular. Jantar leve antes de embarcar: a primeira refeição a bordo sai tarde.',
  links:[{t:'eSIM Ásia — instalar antes de embarcar',u:'https://www.airalo.com'}],

 {ch:'pro',d:'29/08',w:'sáb',cls:'tr',city:'Dubai (conexão 4h50)',stamp:'ok',

  <div class="card"><span class="chip cn">alarme</span><h3>26/08 · 09h de Brasília</h3><p>Ingresso da Cidade Proibida abre exatamente 7 dias antes (20h de Pequim) e esgota em minutos. Site oficial, e-mail + passaporte já cadastrados.</p></div>
 </div>
 <h3 style="margin:34px 0 14px;font-size:16px">Próximas 3 ações</h3>
 <div class="grid g3">
  <div class="card"><b>1.</b> Reservar os 5 hotéis (aba Hotéis tem o porquê de cada um)</div>

function renderRoteiro(){
 let html=`<div class="kicker">Dia a dia</div><h2>Roteiro comentado</h2>
 <p class="lede">Organizado em capítulos. Cada dia traz o essencial, uma leitura cultural do lugar, e os links de reserva no momento exato em que são necessários.</p>`;
 chapters.forEach(ch=>{
  const days=roteiro.filter(r=>r.ch===ch.id);
  if(!days.length)return;
  html+=`<div class="chapter ${ch.cls}"><span class="glyph">${ch.glyph}</span><h3>${ch.title}</h3><span class="dates">${ch.dates}</span></div>
  <p class="chapter-note">${ch.note}</p>`;
  days.forEach(r=>{
   html+=`<div class="day ${r.cls}" id="day-${r.d.replace('/','')}">
    <div class="dcol"><div class="ddate">${r.d}</div><div class="dweek">${r.w}</div></div>
    <div class="dbody">
     <div class="dcity">${r.city}${r.stamp?`<span class="stamp ${r.stamp}">${r.stamp==='ok'?'ok':r.stamp==='new'?'novo':'atenção'}</span>`:''}</div>
     <div class="dprog">${r.prog}</div>
     ${r.tip?`<div class="dtip"><span class="ic">✦</span>${r.tip}</div>`:''}
     ${r.extra?`<div class="dextra"><b>Se sobrar tempo:</b> ${r.extra}</div>`:''}
     ${r.links?`<div class="dlinks">${r.links.map(l=>`<a class="blink" href="${l.u}" target="_blank" rel="noopener">↗ ${l.t}</a>`).join('')}</div>`:''}
     ${r.map?`<div class="dmaps">${r.map.map(m=>`<div class="dmap"><div class="ml">${m.n}</div><iframe src="https://maps.google.com/maps?q=${encodeURIComponent(m.q)}&z=13&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`).join('')}</div>`:''}
    </div></div>`;
  });
 });
 return html;
}

function buildMonth(y,m,fw){const dim=new Date(y,m+1,0).getDate();const c=[];for(let i=0;i<fw;i++)c.push(null);for(let d=1;d<=dim;d++)c.push(d);while(c.length%7)c.push(null);return c;}
function renderCalendario(){
 const rmap={};roteiro.forEach(r=>{const[dd,mm]=r.d.split('/');rmap[`${mm}-${dd}`]=r;});
 const wd=['dom','seg','ter','qua','qui','sex','sáb'];
 const months=[['Agosto 2026',8,buildMonth(2026,7,6)],['Setembro 2026',9,buildMonth(2026,8,2)]];
 return `<div class="kicker">Visão mensal</div><h2>Calendário</h2>
 <p class="lede">Clique num dia pra abrir a programação completa.</p>
 <div class="cal-legend"><span><i class="cal-dot cn"></i>China</span><span><i class="cal-dot jp"></i>Japão</span><span><i class="cal-dot tr"></i>trânsito</span></div>
 <div class="cal-wrap">${months.map(([t,mn,cells])=>`
  <div class="cal-month"><h3 class="cal-title">${t}</h3>
   <div class="cal-grid cal-head">${wd.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
   <div class="cal-grid">${cells.map(d=>{
    if(!d)return `<div class="cal-cell empty"></div>`;
    const r=rmap[`${String(mn).padStart(2,'0')}-${String(d).padStart(2,'0')}`];
    if(!r)return `<div class="cal-cell"><div class="cal-num">${d}</div></div>`;
    return `<div class="cal-cell act ${r.cls}" data-day="${r.d.replace('/','')}"><div class="cal-num">${d}</div><div class="cal-city">${r.city.split('—')[0].split('→')[0].trim().split(' ')[0]}</div></div>`;
   }).join('')}</div></div>`).join('')}</div>`;
}

 <div class="gantt-wrap">

function renderChecklist(){
 let html=`<div class="kicker">Execução</div><h2>Checklist</h2>
 <p class="lede">Marque conforme resolve — o progresso vale só nesta sessão do navegador.</p>
 <div class="prog-wrap"><div class="prog-tk"><div class="prog-fl" id="pf"></div></div><div class="prog-tx" id="pt">0 / 0</div></div>`;
 Object.entries(checklist).forEach(([cat,items])=>{
  html+=`<div class="ck-cat"><h4>${cat}</h4>`;
  items.forEach(([tx,wh],i)=>{html+=`<div class="ck-item" data-k="${cat}-${i}"><div class="ck-box"></div><div class="ck-tx">${tx}</div><div class="ck-when">${wh}</div></div>`;});
  html+=`</div>`;
 });
 return html;
}

const renderers={overview:renderOverview,roteiro:renderRoteiro,hoteis:renderHoteis,calendario:renderCalendario,gantt:renderGantt,orcamento:renderOrcamento,checklist:renderChecklist};
const main=document.getElementById('main');

function showTab(id){
 main.innerHTML=`<section class="active">${renderers[id]()}</section>`;
 document.querySelectorAll('aside nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
 if(id==='checklist')bindCk();
 if(id==='overview')initMap();
 if(id==='calendario')bindCal();
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('sideNav').addEventListener('click',e=>{
 const b=e.target.closest('button');if(b)showTab(b.dataset.tab);
});

function bindCal(){
 document.querySelectorAll('.cal-cell.act').forEach(el=>el.addEventListener('click',()=>{
  showTab('roteiro');
  setTimeout(()=>{const t=document.getElementById(`day-${el.dataset.day}`);if(t)t.scrollIntoView({behavior:'smooth',block:'center'});},90);
 }));
}

const ckState={};
function bindCk(){
 document.querySelectorAll('.ck-item').forEach(el=>{
  if(ckState[el.dataset.k])el.classList.add('done');
  el.addEventListener('click',()=>{el.classList.toggle('done');ckState[el.dataset.k]=el.classList.contains('done');upP();});
 });upP();
}
function upP(){
 const all=document.querySelectorAll('.ck-item'),done=document.querySelectorAll('.ck-item.done');
 document.getElementById('pf').style.width=(done.length/all.length*100)+'%';
 document.getElementById('pt').textContent=`${done.length} / ${all.length}`;
}

let mapInst=null;
const routePts=[
 {n:'São Paulo',lat:-23.435,lng:-46.473,d:'28/08 · 14/09'},
 {n:'Dubai',lat:25.253,lng:55.365,d:'29/08'},
 {n:'Pequim',lat:39.916,lng:116.397,d:'30/08–02/09'},
 {n:'Zhangjiajie',lat:29.117,lng:110.479,d:'02–06/09'},
 {n:'Shenzhen',lat:22.543,lng:114.058,d:'06–08/09'},
 {n:'Tóquio',lat:35.676,lng:139.65,d:'08–13/09'},
 {n:'Doha',lat:25.286,lng:51.534,d:'13–14/09'},
 {n:'São Paulo',lat:-23.435,lng:-46.473,d:'14/09'},
];
function loadL(cb){if(window.L){cb();return;}const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=cb;document.head.appendChild(s);}
function initMap(){
 const el=document.getElementById('routeMap');if(!el)return;
 loadL(()=>{
  if(mapInst){mapInst.remove();mapInst=null;}
  const m=L.map('routeMap',{scrollWheelZoom:false}).setView([15,40],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:8}).addTo(m);
  const ll=routePts.map(p=>[p.lat,p.lng]);
  L.polyline(ll,{color:'#B23A2C',weight:2,dashArray:'6 6',opacity:.85}).addTo(m);
  routePts.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:6,color:'#2E6B5C',fillColor:'#2E6B5C',fillOpacity:1,weight:2}).addTo(m).bindPopup(`<b>${p.n}</b><br>${p.d}`));
  m.fitBounds(ll,{padding:[24,24]});mapInst=m;
 });
}

showTab('overview');
